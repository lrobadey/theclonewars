[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-schism"
version = "0.0.1"
description = "The Schism - Strategic War Sim v2 web app and shared engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "hypothesis>=6.0.0",
  "httpx>=0.24.0",
  "watchfiles>=0.21.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["war_sim", "war_sim.*"]

[tool.setuptools.package-data]

[tool.pytest.ini_options]
testpaths = ["tests", "sim-v2/server/tests"]
pythonpath = ["src", "sim-v2"]
